{% extends 'base.html' %}

{% block title %}Edit Task{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="card shadow-sm p-4">
        <h2 class="mb-4 text-center">Edit Task</h2>

        <!-- Flash messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <!-- Edit form -->
        <form method="POST" action="{{ url_for('tasks.edit_task', task_id=task.id) }}">
            <div class="mb-3">
                <label for="title" class="form-label"><b>Task Title</b></label>
                <input 
                    type="text" 
                    class="form-control" 
                    id="title" 
                    name="title" 
                    value="{{ task.title }}" 
                    required>
            </div>

            <div class="mb-3">
                <label for="due_date" class="form-label"><b>Due Date</b></label>
                <input 
                    type="date" 
                    class="form-control" 
                    id="due_date" 
                    name="due_date"
                    value="{{ task.due_date.strftime('%Y-%m-%d') if task.due_date else '' }}">
            </div>

            <div class="mb-3">
                <label for="due_time" class="form-label"><b>Due Time</b></label>
                <input 
                    type="time" 
                    class="form-control" 
                    id="due_time" 
                    name="due_time"
                    value="{{ task.due_time.strftime('%H:%M') if task.due_time else '' }}">
            </div>

            <div class="d-flex justify-content-between edit-buttons">
                <button type="submit" class="btn btn-save">Save Changes</button>
                <a href="{{ url_for('tasks.view_tasks') }}" class="btn-link cancel-btn">⬅ Back</a>
            </div>
        </form>
    </div>
</div>

<style>
    
input[type="date"],
input[type="time"] {
    position: relative;
    z-index: 10; /* above alerts or card overlays */
}

.btn-save {
  background: var(--neon-pink) !important;
  color: white !important;
  border: none !important;
  box-shadow: 0 0 15px rgba(255, 0, 255, 0.3);
  transition: background 0.3s, box-shadow 0.3s;
}


.cancel-btn:hover {
  background: var(--neon-pink) !important;
  box-shadow: 0 0 20px rgba(255, 0, 255, 0.3);
}

.form-control {
  background: rgba(255, 255, 255, 0.05) !important;
  border: 2px solid rgba(255, 0, 255, 0.3) !important;
  color: white !important;
}

.form-control:focus {
  border-color: var(--neon-pink) !important;
  box-shadow: 0 0 15px rgba(255, 0, 255, 0.3) !important;
  background: rgba(255, 255, 255, 0.08) !important;
}

.form-control::placeholder {
  color: rgba(255, 255, 255, 0.4);
}

@media (max-width: 768px) {
  .button-container {
    flex-direction: column !important;
  }
}
</style>


{% endblock %}
