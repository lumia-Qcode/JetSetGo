{% extends "base.html" %}
{% block title %}Welcome - JetSetGo{% endblock %}

{% block content %}

<div class="landing-container">

    <div class="insta-left">

    <!-- Floating Emojis (always on top) -->
    <div class="emoji e1">🔥</div>
    <div class="emoji e2">💬</div>
    <div class="emoji e3">❤</div>
    <div class="emoji e4">⭐</div>
    <div class="emoji e5">👍</div>

    <!-- Overlapping Cards -->
    <div class="card-stack">

        <!-- Back Card -->
        <div class="frame frame-back">
            <img src="{{ url_for('static', filename='images/T1.jpg') }}" />
        </div>

        <!-- Middle Card -->
        <div class="frame frame-mid">
            <img src="{{ url_for('static', filename='images/T2.jpg') }}" />
        </div>

        <!-- Front Card (Slideshow) -->
        <div class="frame frame-front">
            <img src="{{ url_for('static', filename='images/ARO.jpg') }}" class="slide active">
            <img src="{{ url_for('static', filename='images/T1.jpg') }}" class="slide">
            <img src="{{ url_for('static', filename='images/T2.jpg') }}" class="slide">
        </div>

    </div>

</div>



    <!-- RIGHT SIDE (Login Box) -->
    <div class="landing-right">
        <h1 class="brand-title">JetSetGo</h1>

        <a href="{{ url_for('auth.login') }}" class="btn-login">Log in</a>
        <a href="{{ url_for('auth.register') }}" class="btn-register">Create Account</a>
    </div>
