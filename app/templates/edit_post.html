{% extends 'base.html' %}

{% block title %}Edit Post - JetSetGo{% endblock %}

{% block content %}
<div class="edit-post-container">
    <div class="form-wrapper">
        <h1>Edit Post</h1>
        
        <form method="POST" enctype="multipart/form-data" class="post-form">
            <div class="form-group">
                <label for="content">Post Content</label>
                <textarea 
                    id="content" 
                    name="content" 
                    class="form-control" 
                    placeholder="Share your thoughts, travel tips, memories..." 
                    rows="6" 
                    maxlength="5000"
                    required>{{ post.content }}</textarea>
                <small class="char-count"><span id="charCount">{{ post.content|length }}</span>/5000</small>
            </div>

            <!-- Image Upload Section -->
            <div class="form-group">
                <label>Update Photo (Optional)</label>
                
                <!-- Current Image Display -->
                {% if post.image_url %}
                    <div class="current-image">
                        <p class="image-label">Current Photo:</p>
                        <div class="preview-container">
                            <img src="{{ post.image_url }}" alt="Current post image">
                            <button type="button" class="remove-btn" onclick="removeCurrentImage()">
                                <i class="fas fa-times"></i>
                            </button>
                        </div>
                        <input type="hidden" id="removeImage" name="remove_image" value="0">
                    </div>
                {% endif %}

                <div class="upload-options">
                    <button type="button" class="upload-btn" onclick="document.getElementById('imageInput').click()">
                        <i class="fas fa-image"></i>
                        <span>Upload New Photo</span>
                    </button>
                    <input 
                        type="file" 
                        id="imageInput" 
                        name="photo" 
                        accept="image/jpeg,image/jpg,image/png,image/gif,image/webp"
                        style="display:none;"
                        onchange="handleImageUpload(event)">
                </div>

                <!-- New Image Preview -->
                <div id="imagePreview" class="image-preview" style="display:none;">
                    <div class="preview-container">
                        <img id="previewImg" src="" alt="Preview">
                        <button type="button" class="remove-btn" onclick="removeImage()">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                    <small id="fileName" class="file-name"></small>
                </div>

                <small class="upload-help">Supported formats: JPG, PNG, GIF, WebP (Max 5MB)</small>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save"></i> Save Changes
                </button>
                <a href="{{ url_for('social.your_page') }}" class="btn btn-secondary">
                    <i class="fas fa-times"></i> Cancel
                </a>
            </div>
        </form>
    </div>
</div>
<style>
.edit-post-container {
    max-width: 600px;
    margin: 40px auto;
    padding: 0 20px;
    font-family: 'Orbitron', sans-serif;
    color: #fff;
}

/* Form Wrapper */
.form-wrapper {
    background: #0b0b0b;
    padding: 30px;
    border-radius: 14px;
    box-shadow: 
        0 0 20px rgba(255, 20, 147, 0.6),
        0 0 45px rgba(255, 20, 147, 0.25),
        inset 0 0 20px rgba(255, 20, 147, 0.15);
    backdrop-filter: blur(4px);
}
.form-wrapper h1 {
    margin-top: 0;
    margin-bottom: 30px;
    font-size: 28px;
    color: #ff2ecc;
    text-shadow: 0 0 8px #ff2ecc, 0 0 16px #ff5be0;
}

/* Form Fields */
.post-form {
    display: flex;
    flex-direction: column;
    gap: 20px;
}
.form-group {
    display: flex;
    flex-direction: column;
}
.form-group label {
    font-weight: bold;
    margin-bottom: 8px;
    color: #ff5be0;
    text-shadow: 0 0 4px #ff1493;
    font-size: 14px;
}
.form-control {
    padding: 12px 15px;
    border: 2px solid #ff1493;
    border-radius: 10px;
    font-size: 14px;
    font-family: 'Orbitron', sans-serif;
    background: #111;
    color: #fff;
    transition: all 0.3s;
    resize: vertical;
}
.form-control:focus {
    outline: none;
    border-color: #ff5be0;
    box-shadow: 0 0 8px #ff5be0, 0 0 12px #ff2ecc;
}
textarea.form-control {
    min-height: 150px;
}

/* Character Count */
.char-count {
    font-size: 12px;
    color: #ff77ff;
    text-align: right;
    margin-top: 5px;
}

/* Current Image */
.current-image {
    margin-bottom: 20px;
    padding: 15px;
    background: #111;
    border-radius: 10px;
    border: 2px solid #ff1493;
}
.image-label {
    font-size: 12px;
    font-weight: bold;
    color: #ff5be0;
    margin: 0 0 10px 0;
}

/* Upload Options */
.upload-options {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 15px;
}
.upload-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 15px 20px;
    border: 2px dashed #ff1493;
    border-radius: 10px;
    background: #0b0b0b;
    cursor: pointer;
    transition: all 0.3s;
    font-size: 14px;
    font-weight: 500;
    color: #ff77ff;
}
.upload-btn:hover {
    border-color: #ff5be0;
    box-shadow: 0 0 12px #ff2ecc, 0 0 24px #ff5be0;
    color: #ff2ecc;
}
.upload-btn i {
    font-size: 20px;
}

/* Image Preview */
.image-preview {
    margin: 15px 0;
    padding: 15px;
    background: #111;
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    gap: 10px;
}
.preview-container {
    position: relative;
    display: inline-block;
    max-width: 100%;
}
.preview-container img {
    max-width: 100%;
    max-height: 300px;
    border-radius: 10px;
    object-fit: cover;
    box-shadow: 0 0 10px #ff2ecc, 0 0 20px #ff5be0;
}
.remove-btn {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: rgba(255, 20, 147, 0.8);
    border: none;
    color: #fff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s, transform 0.2s;
    font-size: 16px;
}
.remove-btn:hover {
    background: #ff5be0;
    transform: scale(1.1);
}
.file-name {
    font-size: 12px;
    color: #ff77ff;
    word-break: break-word;
}
.upload-help {
    font-size: 12px;
    color: #ff77ff;
    margin-top: 5px;
}

/* Form Actions */
.form-actions {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
}
.btn {
    padding: 10px 20px;
    border-radius: 10px;
    font-weight: bold;
    transition: all 0.3s;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    border: none;
    cursor: pointer;
    font-size: 14px;
}
.btn-primary {
    background: linear-gradient(135deg, #ff1493 0%, #ff2ecc 50%, #ff5be0 100%);
    color: #fff;
    box-shadow: 0 0 10px #ff1493, 0 0 20px #ff5be0;
}
.btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 0 14px #ff2ecc, 0 0 28px #ff5be0;
}
.btn-secondary {
    background: #222;
    color: #ff1493;
    border: 1px solid #ff1493;
    box-shadow: 0 0 6px #ff1493;
}
.btn-secondary:hover {
    background: #ff1493;
    color: #0b0b0b;
    box-shadow: 0 0 12px #ff5be0;
}

/* Responsive */
@media (max-width: 768px) {
    .form-wrapper { padding: 20px; }
    .form-wrapper h1 { font-size: 22px; }
    .form-actions { flex-direction: column; }
    .btn { width: 100%; justify-content: center; }
    .upload-btn { flex-direction: column; text-align: center; }
}
</style>


<script>
    const textarea = document.getElementById('content');
    const charCount = document.getElementById('charCount');
    const imageInput = document.getElementById('imageInput');
    const imagePreview = document.getElementById('imagePreview');
    const previewImg = document.getElementById('previewImg');
    const fileName = document.getElementById('fileName');
    const removeImageInput = document.getElementById('removeImage');

    // Character count
    textarea.addEventListener('input', function() {
        charCount.textContent = this.value.length;
    });

    // Handle image upload
    function handleImageUpload(event) {
        const file = event.target.files[0];
        
        if (!file) return;

        // Validate file type
        const allowedTypes = ['image/jpeg', 'image/jpg', 'image/png', 'image/gif', 'image/webp'];
        if (!allowedTypes.includes(file.type)) {
            alert('Invalid file type. Please upload JPG, PNG, GIF, or WebP.');
            imageInput.value = '';
            return;
        }

        // Validate file size (5MB)
        const maxSize = 5 * 1024 * 1024; // 5MB
        if (file.size > maxSize) {
            alert('File is too large. Maximum size is 5MB.');
            imageInput.value = '';
            return;
        }

        // Display preview
        const reader = new FileReader();
        reader.onload = function(e) {
            previewImg.src = e.target.result;
            fileName.textContent = file.name;
            imagePreview.style.display = 'flex';
        };
        reader.readAsDataURL(file);
    }

    // Remove new image
    function removeImage() {
        imageInput.value = '';
        imagePreview.style.display = 'none';
        previewImg.src = '';
        fileName.textContent = '';
    }

    // Remove current image
    function removeCurrentImage() {
        const currentImage = document.querySelector('.current-image');
        removeImageInput.value = '1';
        currentImage.style.display = 'none';
    }

    // Prevent form submission if file is too large
    document.querySelector('.post-form').addEventListener('submit', function(e) {
        if (imageInput.files.length > 0) {
            const file = imageInput.files[0];
            const maxSize = 5 * 1024 * 1024;
            
            if (file.size > maxSize) {
                e.preventDefault();
                alert('File is too large. Maximum size is 5MB.');
            }
        }
    });
</script>
{% endblock %}
